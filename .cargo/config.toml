[build]
target = "aarch64-unknown-none-softfloat"
rustflags = ["-C", "llvm-args=-global-isel=false"]

# `cargo run --release --features qemu` boots the hypervisor in QEMU.
[target.aarch64-unknown-none-softfloat]
runner = "tools/qemu-run.sh"

[target.riscv64imac-unknown-none-elf]
runner = "tools/qemu-run.sh"
