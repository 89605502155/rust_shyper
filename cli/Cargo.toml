[package]
name = "trosna-shyper-cli"
version = "0.2.0"
edition = "2021"
description = "Command line tool to manage trosna-shyper virtual machines from the MVM"
license = "MulanPSL-2.0"

[[bin]]
name = "shyper"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.21"
once_cell = "1.19.0"
rustix = { version = "1", features = ["fs", "mm", "param", "system"] }
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
signal-hook = "0.3.17"


[features]
# unikernel library OS support of the hypervisor
unilib = []
